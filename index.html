<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Filter benign Vite websocket / HMR notices in sandboxed preview environment where HMR is disabled
      (function() {
        var isViteNotice = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            if (!arg) continue;
            var str = '';
            if (typeof arg === 'string') {
              str = arg;
            } else if (typeof arg.message === 'string') {
              str = arg.message;
            } else if (arg instanceof Error) {
              str = (arg.message || '') + ' ' + (arg.stack || '');
            } else {
              try { str = JSON.stringify(arg) || String(arg); } catch(e) { str = String(arg); }
            }
            var lower = str.toLowerCase();
            if (
              lower.indexOf('[vite]') !== -1 ||
              lower.indexOf('vite:') !== -1 ||
              lower.indexOf('failed to connect to websocket') !== -1 ||
              lower.indexOf('websocket closed without opened') !== -1 ||
              (lower.indexOf('websocket') !== -1 && lower.indexOf('vite') !== -1)
            ) {
              return true;
            }
          }
          return false;
        };

        ['error', 'warn', 'info', 'log', 'debug'].forEach(function(method) {
          var original = console[method];
          if (original) {
            console[method] = function() {
              if (isViteNotice.apply(null, arguments)) {
                return;
              }
              return original.apply(console, arguments);
            };
          }
        });

        window.addEventListener('error', function(event) {
          if (
            event && (
              isViteNotice(event.message, event.filename, event.error) ||
              (event.target && event.target.tagName === 'SCRIPT' && (event.target.src || '').indexOf('vite') !== -1) ||
              (typeof WebSocket !== 'undefined' && event.target instanceof WebSocket)
            )
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          if (reason && (isViteNotice(reason, reason.message, reason.stack))) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
