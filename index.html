<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Filter benign Vite websocket / HMR notices in sandboxed preview environment where HMR is disabled
      (function() {
        var isViteNotice = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            if (!arg) continue;
            var str = '';
            if (typeof arg === 'string') {
              str = arg;
            } else if (typeof arg.message === 'string') {
              str = arg.message;
            } else if (arg instanceof Error) {
              str = (arg.message || '') + ' ' + (arg.stack || '');
            } else {
              try { str = String(arg); } catch(e) {}
            }
            if (
              str.indexOf('[vite]') !== -1 ||
              str.indexOf('vite:') !== -1 ||
              str.indexOf('failed to connect to websocket') !== -1 ||
              str.indexOf('WebSocket closed without opened') !== -1
            ) {
              return true;
            }
          }
          return false;
        };

        ['error', 'warn', 'info', 'log', 'debug'].forEach(function(method) {
          var original = console[method];
          if (original) {
            console[method] = function() {
              if (isViteNotice.apply(null, arguments)) {
                return;
              }
              return original.apply(console, arguments);
            };
          }
        });

        window.addEventListener('error', function(event) {
          if (event && (isViteNotice(event.message) || isViteNotice(event.error))) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          if (reason && (isViteNotice(reason) || isViteNotice(reason.message))) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
